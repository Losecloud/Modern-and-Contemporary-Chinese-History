<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 550" width="550" height="550" role="img" aria-label="党旗标志">
  <defs>
    <!-- 红旗底色：左上到右下的红色渐变，比纯色更有质感 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e52626"/>
      <stop offset="1" stop-color="#9c0f0f"/>
    </linearGradient>
    <!-- 党徽金黄色渐变 -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe95c"/>
      <stop offset="1" stop-color="#eab308"/>
    </linearGradient>
    <!-- 圆角裁切，避免图形溢出圆角 -->
    <clipPath id="corner">
      <rect width="550" height="550" rx="120"/>
    </clipPath>
  </defs>

  <g clip-path="url(#corner)">
    <!-- 红底 -->
    <rect width="550" height="550" fill="url(#bg)"/>
    <!-- 镰刀锤子：源自 Wikimedia 公有领域图形，整体略微缩小居中留出边距 -->
